name: Forward beta test results to private processor

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

concurrency:
  group: forward-test-result-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  forward-result:
    if: startsWith(github.event.issue.title, '[Test Results]:')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Forward issue reference to private processor
        env:
          PRIVATE_DISPATCH_TOKEN: ${{ secrets.IRONWOVEN_PRIVATE_DISPATCH_TOKEN }}
          PRIVATE_DISPATCH_URL: ${{ secrets.IRONWOVEN_PRIVATE_DISPATCH_URL }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTION: ${{ github.event.action }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit

          token = os.environ.get("PRIVATE_DISPATCH_TOKEN", "").strip()
          if not token:
              sys.exit("Missing Actions secret IRONWOVEN_PRIVATE_DISPATCH_TOKEN.")

          dispatch_url = os.environ.get("PRIVATE_DISPATCH_URL", "").strip()
          if not dispatch_url:
              sys.exit("Missing Actions secret IRONWOVEN_PRIVATE_DISPATCH_URL.")
          parsed_url = urlsplit(dispatch_url)
          if (
              parsed_url.scheme != "https"
              or parsed_url.netloc != "api.github.com"
              or parsed_url.query
              or parsed_url.fragment
              or not re.fullmatch(r"/repos/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/dispatches", parsed_url.path)
          ):
              sys.exit("Actions secret IRONWOVEN_PRIVATE_DISPATCH_URL must be an HTTPS GitHub repository-dispatch endpoint.")

          payload = {
              "event_type": "public-test-result-submitted",
              "client_payload": {
                  "repository": os.environ["SOURCE_REPOSITORY"],
                  "issue_number": os.environ["ISSUE_NUMBER"],
                  "action": os.environ["ISSUE_ACTION"],
              },
          }
          request = urllib.request.Request(
              dispatch_url,
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "Ironwoven-Public-Test-Result-Forwarder",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 204:
                      sys.exit(f"Private dispatch returned unexpected HTTP status {response.status}.")
          except urllib.error.HTTPError as error:
              sys.exit(f"Private dispatch failed with HTTP {error.code}; the report was not processed.")
          print("Test-result issue reference forwarded to the private processor.")
          PY

      - name: Explain forwarding failure on the public issue
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "body": (
                  "**Automatic processing could not be started.** Your report has not been applied or closed. "
                  "A maintainer must check the private automation connection and retry the submission."
              )
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['SOURCE_REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "Ironwoven-Public-Test-Result-Forwarder",
              },
          )
          with urllib.request.urlopen(request, timeout=20):
              pass
          PY
