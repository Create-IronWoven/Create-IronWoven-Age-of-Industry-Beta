name: Feature suggestion
description: Suggest a feature, modpack improvement, or quality-of-life change.
title: "[Suggestion]: "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        This is a public GitHub issue. Its title, answers, comments, and attachments are visible immediately. GitHub displays your account as the issue author; a nickname does not hide it.
        Do not include personal contact details, passwords, access tokens, private server addresses, local paths, or private configuration.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the idea clearly.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why would this improve Create IronWoven: Age of Industry?
      description: Explain how it fits the Create / Aeronautics / engineering / exploration focus.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or references
      description: Optional links or other approaches.
    validations:
      required: false
