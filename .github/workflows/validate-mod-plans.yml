name: Validate public mod plan

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'DIMENSIONS.md'
      - 'CHANGELOG.md'
      - 'BETA_UPDATES.md'
      - 'SUPPORT.md'
      - 'archive/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'BETA_STATUS.md'
      - 'MODS.md'
      - 'MOD_PLANS.md'
      - 'KNOWN_ISSUES.md'
      - 'TESTING_CHECKLIST.md'
      - '.github/ISSUE_TEMPLATE/functional-test-report.yml'
      - '.github/workflows/forward-test-results.yml'
      - '.github/workflows/validate-mod-plans.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'BETA_STATUS.md'
      - 'MODS.md'
      - 'MOD_PLANS.md'
      - 'KNOWN_ISSUES.md'
      - 'TESTING_CHECKLIST.md'
      - '.github/ISSUE_TEMPLATE/functional-test-report.yml'
      - '.github/workflows/forward-test-results.yml'
      - '.github/workflows/validate-mod-plans.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep the newest branch validation when rapid commits supersede earlier inputs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out public beta repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate functional test form and public forwarding workflow
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/ISSUE_TEMPLATE/functional-test-report.yml"); YAML.load_file(".github/workflows/forward-test-results.yml"); puts "PASS: functional test form and forwarding workflow YAML parse."'
          python - <<'PY'
          from pathlib import Path
          form = Path('.github/ISSUE_TEMPLATE/functional-test-report.yml').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/forward-test-results.yml').read_text(encoding='utf-8')
          checklist = Path('TESTING_CHECKLIST.md').read_text(encoding='utf-8')
          required = ['id: test-environment', '- Single-player', '- Multiplayer', '- Both']
          missing = [item for item in required if item not in form]
          required_forwarder = ['public-test-result-submitted', 'IRONWOVEN_PRIVATE_DISPATCH_TOKEN',
                                'PRIVATE_DISPATCH_URL', 'IRONWOVEN_PRIVATE_DISPATCH_URL',
                                'urlsplit', 'api.github.com']
          missing_forwarder = [item for item in required_forwarder if item not in workflow]
          hardcoded_private_endpoint = 'request = urllib.request.Request(\n              "https://api.github.com/repos/' in workflow
          headers = checklist.count('| Test action | Result | Test environment | Tester nickname | Test date (DD-MM-YYYY) | Evidence / notes (log, screenshot, observations) |')
          if missing or missing_forwarder or hardcoded_private_endpoint or headers == 0 or Path('scripts').exists():
              raise SystemExit(
                  f'FAIL: missing form values {missing}; missing forwarder markers {missing_forwarder}; '
                  f'hard-coded dispatch endpoint={hardcoded_private_endpoint}; environment-aware checklist headers {headers}; public scripts directory exists={Path("scripts").exists()}'
              )
          print(f'PASS: test environment choices present; forwarding workflow reads its private dispatch destination from Actions secrets; {headers} checklist sections include the environment column.')
          print('PASS: public repository contains no scripts/ directory.')
          PY

      - name: Validate player-facing documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              "README.md": ["# Create IronWoven: Age of Industry", "## Platform", "## Feedback"],
              "BETA_STATUS.md": ["# Beta Status", "## Current status", "## Release readiness"],
              "MODS.md": ["# Mods in Create IronWoven: Age of Industry", "not a final release manifest"],
              "MOD_PLANS.md": ["# Mod Plans", "## Status meanings", "## Explicit exclusions",
                               "not the installed-mod list"],
              "KNOWN_ISSUES.md": ["# Known Issues", "## Reporting a new issue"],
              "TESTING_CHECKLIST.md": ["# Full Installed-Mod Functional Testing Checklist",
                                       "## Smoke test is not a function test"],
          }

          errors = []
          for filename, markers in required.items():
              path = Path(filename)
              if not path.is_file():
                  errors.append(f"Missing required player page: {filename}")
                  continue
              content = path.read_text(encoding="utf-8")
              for marker in markers:
                  if marker.lower() not in content.lower():
                      errors.append(f"{filename} is missing required content marker: {marker}")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              raise SystemExit(1)

          print("PASS: all six player-facing entry pages exist and retain their required sections.")
          print("PASS: the functional checklist remains distinct from routine smoke testing.")
          PY

      - name: Validate protected tester navigation and official branding
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md").read_text(encoding="utf-8")
          protected = {
              "Open beta tester application": "https://github.com/alexth110987/Create-IronWoven-Age-of-Industry/issues/new?template=beta_application.yml",
              "Current beta status": "BETA_STATUS.md",
              "Mods in the current test pack": "MODS.md",
              "Planned mods and project decisions": "MOD_PLANS.md",
              "Testing progress": "TESTING_CHECKLIST.md",
              "Submit test results": "https://github.com/Create-IronWoven/Create-IronWoven-Age-of-Industry-Beta/issues/new?template=functional-test-report.yml",
              "Known issues": "KNOWN_ISSUES.md",
              "Dimensions and exploration": "DIMENSIONS.md",
              "Changelog": "CHANGELOG.md",
              "Beta updates": "BETA_UPDATES.md",
              "Support and troubleshooting": "SUPPORT.md",
              "Report a problem or suggest an idea": "https://github.com/Create-IronWoven/Create-IronWoven-Age-of-Industry-Beta/issues/new/choose",
          }
          errors = []
          for label, target in protected.items():
              if not re.search(rf"\\[{re.escape(label)}\\]\\(({re.escape(target)})(?:\\))", readme):
                  errors.append(f"Protected navigation link missing or changed: {label}")
              if not target.startswith("https://") and not Path(target).is_file():
                  errors.append(f"Protected local destination missing: {target}")

          forms = (
              ".github/ISSUE_TEMPLATE/functional-test-report.yml",
              ".github/ISSUE_TEMPLATE/bug_report.yml",
              ".github/ISSUE_TEMPLATE/feature_suggestion.yml",
              ".github/ISSUE_TEMPLATE/compatibility_report.yml",
          )
          for form in forms:
              if not Path(form).is_file():
                  errors.append(f"Expected issue form is missing: {form}")

          logo_url = "assets/Ironwoven_%20Age%20of%20Industry.v2.png"
          logo_file = Path("assets/Ironwoven_ Age of Industry.v2.png")
          if f"]({logo_url})" not in readme or not logo_file.is_file():
              errors.append("Official IronWoven logo/banner reference or source file is missing.")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              raise SystemExit(1)
          print("PASS: all 12 protected navigation links retain their intended destinations.")
          print("PASS: application and test-result forms, issue chooser forms, and official logo are present.")
          PY
