name: Apply beta test results

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-test-result-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply-result:
    if: startsWith(github.event.issue.title, '[Test Results]:')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Apply result to the matching checklist row
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python - <<'PY'
          import json
          import os
          import runpy
          from pathlib import Path
          import urllib.request

          # Fetch the trusted updater script from the repository's main branch.
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          url = f"https://api.github.com/repos/{repository}/contents/scripts/apply_test_result.py?ref=main"
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              import base64
              source = base64.b64decode(json.load(response)["content"])
          Path("apply_test_result.py").write_bytes(source)
          runpy.run_path("apply_test_result.py", run_name="__main__")
        PY
