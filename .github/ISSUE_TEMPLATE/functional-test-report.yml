name: Functional test result
description: Submit one test result. The checklist updates automatically.
title: "[Test Results]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Submit one form for each test action you complete. Once the repository's one-time Actions write permission is configured, the matching row in the public testing checklist will update automatically. If GitHub blocks the write, the report stays open and explains what needs maintainer attention.

        Before filling this in, open the [testing checklist](https://github.com/alexth110987/Create-IronWoven-Beta/blob/main/TESTING_CHECKLIST.md):
        - Copy the mod's exact heading text, including its version, but leave off the leading ### symbols.
        - Copy the exact test-action text from that mod's table.
        - Paste both below. This makes sure the correct checklist row is updated.

        Your nickname, result and evidence will be recorded in the checklist. Do not include your legal name or account username anywhere in this form or evidence. If the action already has a result, the automation will not overwrite it; a maintainer will review retests.
  - type: input
    id: tester-name
    attributes:
      label: Tester nickname (no real name or GitHub username)
      description: Enter a nickname or pseudonym that identifies you for this test. Do not enter your legal/real name or your GitHub account username.
      placeholder: Your chosen tester nickname
    validations:
      required: true
  - type: input
    id: test-date
    attributes:
      label: Test date
      description: Use YYYY-MM-DD.
      placeholder: "2026-11-05"
    validations:
      required: true
  - type: input
    id: mod-name
    attributes:
      label: Exact mod section heading
      description: Copy only the heading text from the checklist, including its version number. Do not include the leading ### symbols.
      placeholder: "Create: Example Mod 1.2.3"
    validations:
      required: true
  - type: input
    id: test-action
    attributes:
      label: Exact test action
      description: Copy the complete test-action text from the checklist table.
      placeholder: "Verify the main feature works as expected."
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Test result
      options:
        - Pass
        - Partial
        - Failed
        - Blocked
        - N/A
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What happened? (required)
      description: Briefly describe what you observed. You can include a link or filename for sanitized evidence. Do not include usernames, private paths, IP addresses, tokens, or other personal information.
      placeholder: "The machine processed the item and produced the expected output."
    validations:
      required: true
