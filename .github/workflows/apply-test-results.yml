name: Apply beta test results

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-test-result-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply-result:
    if: startsWith(github.event.issue.title, '[Test Results]:')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out public beta repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Apply result to the matching checklist row
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/apply_test_result.py
