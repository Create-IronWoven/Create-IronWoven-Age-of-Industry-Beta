name: Validate public mod plan

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'BETA_STATUS.md'
      - 'MODS.md'
      - 'MOD_PLANS.md'
      - 'KNOWN_ISSUES.md'
      - 'TESTING_CHECKLIST.md'
      - '.github/ISSUE_TEMPLATE/functional-test-report.yml'
      - '.github/workflows/forward-test-results.yml'
      - '.github/workflows/validate-mod-plans.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'BETA_STATUS.md'
      - 'MODS.md'
      - 'MOD_PLANS.md'
      - 'KNOWN_ISSUES.md'
      - 'TESTING_CHECKLIST.md'
      - '.github/ISSUE_TEMPLATE/functional-test-report.yml'
      - '.github/workflows/forward-test-results.yml'
      - '.github/workflows/validate-mod-plans.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out public beta repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate functional test form and public forwarding workflow
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/ISSUE_TEMPLATE/functional-test-report.yml"); YAML.load_file(".github/workflows/forward-test-results.yml"); puts "PASS: functional test form and forwarding workflow YAML parse."'
          python - <<'PY'
          from pathlib import Path
          form = Path('.github/ISSUE_TEMPLATE/functional-test-report.yml').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/forward-test-results.yml').read_text(encoding='utf-8')
          checklist = Path('TESTING_CHECKLIST.md').read_text(encoding='utf-8')
          required = ['id: test-environment', '- Single-player', '- Multiplayer', '- Both']
          missing = [item for item in required if item not in form]
          required_forwarder = ['public-test-result-submitted', 'IRONWOVEN_PRIVATE_DISPATCH_TOKEN',
                                'PRIVATE_DISPATCH_URL: ${{ secrets.IRONWOVEN_PRIVATE_DISPATCH_URL }}',
                                'urlsplit', 'api.github.com']
          missing_forwarder = [item for item in required_forwarder if item not in workflow]
          hardcoded_private_endpoint = 'https://api.github.com/repos/' in workflow
          headers = checklist.count('| Test action | Result | Test environment | Tester nickname | Test date (DD-MM-YYYY) | Evidence / notes (log, screenshot, observations) |')
          if missing or missing_forwarder or hardcoded_private_endpoint or headers == 0 or Path('scripts').exists():
              raise SystemExit(
                  f'FAIL: missing form values {missing}; missing forwarder markers {missing_forwarder}; '
                  f'hard-coded dispatch endpoint={hardcoded_private_endpoint}; environment-aware checklist headers {headers}; public scripts directory exists={Path("scripts").exists()}'
              )
          print(f'PASS: test environment choices present; forwarding workflow targets the private processor; {headers} checklist sections include the environment column.')
          print('PASS: public repository contains no scripts/ directory.')
          PY

      - name: Validate player-facing documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              "README.md": ["# Ironwoven: Age of Industry", "## Platform", "## Feedback"],
              "BETA_STATUS.md": ["# Beta Status", "## Current status", "## Release readiness"],
              "MODS.md": ["# Mods in Ironwoven: Age of Industry", "not a final release manifest"],
              "MOD_PLANS.md": ["# Mod Plans", "## Status meanings", "## Explicit exclusions",
                               "not the installed-mod list"],
              "KNOWN_ISSUES.md": ["# Known Issues", "## Reporting a new issue"],
              "TESTING_CHECKLIST.md": ["# Full Installed-Mod Functional Testing Checklist",
                                       "## Smoke test is not a function test"],
          }

          errors = []
          for filename, markers in required.items():
              path = Path(filename)
              if not path.is_file():
                  errors.append(f"Missing required player page: {filename}")
                  continue
              content = path.read_text(encoding="utf-8")
              for marker in markers:
                  if marker.lower() not in content.lower():
                      errors.append(f"{filename} is missing required content marker: {marker}")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              raise SystemExit(1)

          print("PASS: all six player-facing entry pages exist and retain their required sections.")
          print("PASS: the functional checklist remains distinct from routine smoke testing.")
          PY