name: Validate public mod plan

on:
  push:
    branches: [main]
    paths:
      - 'MOD_PLANS.md'
      - '.github/workflows/validate-mod-plans.yml'
  pull_request:
    paths:
      - 'MOD_PLANS.md'
      - '.github/workflows/validate-mod-plans.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public beta repository
        uses: actions/checkout@v4

      - name: Validate player-facing mod plan
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("MOD_PLANS.md")
          if not path.is_file():
              raise SystemExit("Missing required file: MOD_PLANS.md")

          content = path.read_text(encoding="utf-8")
          required_sections = [
              "# Mod Plans",
              "## Status meanings",
              "## Current testing and follow-ups",
              "## Future ideas",
              "## Paused work",
              "## Explicit exclusions",
          ]
          missing = [section for section in required_sections if section not in content]
          if missing:
              for section in missing:
                  print(f"::error::Missing required section: {section}")
              raise SystemExit(1)

          if "not an installed-mod list" not in content:
              raise SystemExit("Mod plan must clarify that it is not the installed inventory.")

          print("PASS: player-facing mod plan sections are present.")
          print("PASS: installed inventory is clearly distinguished.")
          PY
