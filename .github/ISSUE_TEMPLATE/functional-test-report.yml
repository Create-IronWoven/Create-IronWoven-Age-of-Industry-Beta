name: Functional test result
description: Submit one test result. The checklist updates automatically.
title: "[Test Results]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **This is a public GitHub issue. The full issue body, all form answers, comments, and attachments are visible as soon as you submit.** The form cannot screen the initial submission before GitHub makes it public. Do not include real names, email addresses, personal contact details, private server addresses, passwords, access tokens, local paths, raw private configs, or other sensitive information.

        Submit one form for each test action you complete. The test-result forwarding connection is active. The private processor checks each report against the exact mod heading and test action. Forwarding and invalid-report safeguards have been verified; valid checklist-row updates are still undergoing final verification. If forwarding, validation, or checklist updating fails, the report stays open with an explanatory comment for maintainer attention.

        Before filling this in, open the [testing checklist](https://github.com/Create-IronWoven/Create-IronWoven-Age-of-Industry-Beta/blob/main/TESTING_CHECKLIST.md):
        - Copy the mod's exact heading text, including its version, but leave off the leading ### symbols.
        - Copy the exact test-action text from that mod's table.
        - Paste both below. This makes sure the correct checklist row is updated.

        Your selected test environment (Single-player, Multiplayer, or Both), nickname, result and evidence will be recorded in the checklist. The automation does not copy your GitHub username into the checklist. **Important:** GitHub displays the account that opened an issue as its public issue author; this form cannot hide that account identity. If you need your GitHub account to remain private, do not submit through this public issue form. Do not include your legal name or account username in the form fields or evidence. If the action already has a result, the automation will not overwrite it; a maintainer will review retests.
  - type: input
    id: tester-name
    attributes:
      label: Tester nickname (no real name or GitHub username)
      description: Enter a nickname or pseudonym that identifies you for this test. Do not enter your legal/real name or your GitHub account username.
      placeholder: Your chosen tester nickname
    validations:
      required: true
  - type: input
    id: test-date
    attributes:
      label: Test date
      description: Use DD-MM-YYYY.
      placeholder: "05-11-2026"
    validations:
      required: true
  - type: input
    id: mod-name
    attributes:
      label: Exact mod section heading
      description: Copy only the heading text from the checklist, including its version number. Do not include the leading ### symbols.
      placeholder: "Create: Example Mod 1.2.3"
    validations:
      required: true
  - type: input
    id: test-action
    attributes:
      label: Exact test action
      description: Copy the complete test-action text from the checklist table.
      placeholder: "Verify the main feature works as expected."
    validations:
      required: true
  - type: dropdown
    id: test-environment
    attributes:
      label: Test environment
      description: Select where you actually performed this test action.
      options:
        - Single-player
        - Multiplayer
        - Both
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Test result
      options:
        - Pass
        - Partial
        - Failed
        - Blocked
        - N/A
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What happened? (required)
      description: Briefly describe what you observed. You can include a link or filename for sanitized evidence. Do not include usernames, private paths, IP addresses, tokens, or other personal information.
      placeholder: "The machine processed the item and produced the expected output."
    validations:
      required: true
